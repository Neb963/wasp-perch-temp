# Static-host smoke: serve studio/ over plain HTTP (no Perchance framing) and
# drive it with headless Chromium (Playwright): boot, RESOLVE, Edge synth,
# Full synth, MAP_PROMPT, Director plan, offline runtime with network cut.
# Models: Full INT8 from the ungated ml-resources/steer-tts mirror (recorded
# revision) + Edge runtime set and Full native-only files from ci-assets.
name: Static-host smoke (playwright, no Perchance)
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout studio repo
        uses: actions/checkout@v4
        with: { path: repo }
      - name: Checkout ci-assets
        uses: actions/checkout@v4
        with: { ref: ci-assets, path: ci-assets }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install huggingface_hub (mirror download)
        run: pip install huggingface_hub
      - name: Assemble studio/src/models (exact shipped set from ci-assets)
        run: |
          echo "ci-assets revision: $(cd ci-assets && git rev-parse --short HEAD)"
          mkdir -p repo/studio/src/models
          edge="repo/studio/src/models/edge"; rm -rf "$edge"; cp -r ci-assets/edge "$edge"
          full="repo/studio/src/models/full"; rm -rf "$full"; cp -r ci-assets/full "$full"
          echo "edge files: $(find "$edge" -type f | wc -l), full files: $(find "$full" -type f | wc -l)"
          ls "$full" "$full/int8"
      - name: Install Playwright + Chromium
        run: |
          mkdir -p pw && cd pw && npm init -y >/dev/null && npm i playwright@1.49.1
          npx playwright install chromium --with-deps
      - name: Serve statically + run smoke
        run: |
          cd repo/studio && (python3 -m http.server 8123 >/tmp/http.log 2>&1 &) && sleep 2
          curl -s -o /dev/null -w "index %{http_code}, wasm %{http_code}\n" http://localhost:8123/index.html || true
          curl -s -o /dev/null -w "%{http_code}\n" http://localhost:8123/src/wasm-dist/steertts-wasm.wasm
          PW_DIR=$GITHUB_WORKSPACE/pw node scripts/ci/static_smoke.mjs . smoke-out
          cp /tmp/http.log smoke-out/http-server.log || true
      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-smoke-${{ github.run_id }}
          path: repo/studio/smoke-out/
      - name: Summary
        if: always()
        run: |
          if [ -f repo/studio/smoke-out/smoke_report.json ]; then
            python3 - <<'PYEOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          r = json.load(open('repo/studio/smoke-out/smoke_report.json'))
          print('## static smoke: ' + r['verdict'])
          PYEOF
          else
            echo "## static smoke: no report produced (early step failure - see step logs)" >> "$GITHUB_STEP_SUMMARY"
          fi
