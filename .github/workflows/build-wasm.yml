# Build-only CI: compile the C engine to WASM. No weights, no audio, no tokens, no inference.
name: Build SteerTTS WASM (source-only)
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { path: studio }
      - name: Pin upstream source (exact SHA, no weights needed)
        run: |
          git init upstream && cd upstream
          git remote add origin https://github.com/WhissleAI/steer-tts.git
          git fetch --depth 1 origin 5008f8e032f69266c3f37788825cfda3112eab55
          git checkout 5008f8e032f69266c3f37788825cfda3112eab55
          git rev-parse HEAD
          patch -p1 < ../studio/src/wasm/patches/emscripten-weights.patch && echo PATCH-OK
          pwd && ls && echo "--- C sources ---" && ls c/src/ c/src/front/ | head -60
      - name: Set up Emscripten 3.1.68
        uses: mymindstorm/setup-emsdk@v14
        with: { version: 3.1.68 }
      - name: Compile (single-thread scalar baseline, MEMFS, no embedded assets)
        run: |
          mkdir -p dist
          set +e
          emcc -O2 -std=c11 -ffp-contract=off -fno-fast-math -Wall \
            -Iupstream/c/include -Iupstream/c/src \
            upstream/c/src/*.c upstream/c/src/front/*.c \
            studio/src/wasm/scl_bridge.c \
            -o dist/steertts-wasm.js \
            -s WASM=1 -s MODULARIZE=1 -s EXPORT_NAME=createSteerTTS \
            -s ENVIRONMENT=node,worker -s SINGLE_FILE=0 \
            -s ALLOW_MEMORY_GROWTH=1 -s INITIAL_MEMORY=64MB -s MAXIMUM_MEMORY=1024MB -s STACK_SIZE=8MB \
            -s EXPORTED_FUNCTIONS='[["_scl_version","_scl_create","_scl_destroy","_scl_synthesize_json","_scl_free_wav","_scl_free_str","_scl_map_prompt","_scl_resolve_json","_scl_has","_scl_director_load","_scl_director_moods","_scl_director_plan_json","_scl_director_free","_scl_speaker_vector","_malloc","_free"]' \
            -s EXPORTED_RUNTIME_METHODS='["FS","HEAPU8","HEAPF32","cwrap","getValue","UTF8ToString"]' \
            -s STRICT=1 -s NODEJS_CATCH_EXIT=0 > dist-build.log 2>&1
          RC=$?
          echo "emcc exit: $RC"
          tail -n 100 dist-build.log
          cp dist-build.log dist/build.log
          printf '{"bridge":"scl-bridge-0.3.0","upstream":"5008f8e032f69266c3f37788825cfda3112eab55","emsdk":"3.1.68","flags":"-O2 -ffp-contract=off scalar single-thread MEMFS","simd":false,"threads":false}' > dist/BUILD-MANIFEST.json
          exit $RC
      - name: Smoke test (instantiate + version, no model)
        run: node studio/src/tools/wasm-build/smoke-test.mjs dist/steertts-wasm.js 2>&1 | tee -a dist-build.log; test ${PIPESTATUS[0]} -eq 0
      - uses: actions/upload-artifact@v4
        with: { name: steertts-wasm-dist, path: dist/ }
      - name: Save build log into repo (always runs)
        if: always()
        run: |
          cd studio
          git config user.email "scl-ci@local" && git config user.name "scl-ci"
          mkdir -p ci-logs
          cp "$GITHUB_WORKSPACE/dist-build.log" ci-logs/build-${{ github.run_id }}.log 2>/dev/null || echo "(no log captured)" > ci-logs/build-${{ github.run_id }}.log
          git add ci-logs && git commit -m "ci log ${{ github.run_id }}" && git push origin HEAD:main
      - name: Publish dist branch (on success)
        if: success()
        run: |
          cd "$GITHUB_WORKSPACE"
          git clone --no-checkout "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" pub && cd pub
          git config user.email "scl-ci@local" && git config user.name "scl-ci"
          git checkout --orphan wasm-dist
          git rm -rf . > /dev/null 2>&1 || true
          cp ../dist/steertts-wasm.js ../dist/steertts-wasm.wasm ../dist/BUILD-MANIFEST.json .
          git add . && git commit -m "wasm dist ${{ github.run_id }}" && git push -f origin wasm-dist
