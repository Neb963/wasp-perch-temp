# Parity: native upstream Python (torch CPU) vs the same C engine via WASM+Node.
# No browser, no user machine. Trigger: Actions tab -> Run workflow.
# Model weights: Full INT8 from the UNGATED mirror ml-resources/steer-tts
# (revision recorded per run); Edge runtime set + Full native-only files
# from this repo's ci-assets branch (non-commercial test fixtures, see
# ci-assets/ATTRIBUTION.md). Nothing is committed back; results are artifacts.
name: Parity native-vs-WASM (torch CPU vs wasm node)
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  parity:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout studio repo (scripts)
        uses: actions/checkout@v4
        with: { path: studio }
      - name: Checkout upstream code at pinned SHA
        uses: actions/checkout@v4
        with:
          repository: WhissleAI/steer-tts
          ref: 5008f8e032f69266c3f37788825cfda3112eab55
          path: upstream
      - name: Checkout ci-assets (edge weights + full native-only files)
        uses: actions/checkout@v4
        with: { ref: ci-assets, path: ci-assets }
      - name: Checkout wasm dist (bridge 0.3.0)
        uses: actions/checkout@v4
        with: { ref: wasm-dist, path: dist }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install native deps (CPU torch, no CUDA)
        run: |
          pip install --upgrade pip "setuptools>=68"
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchaudio
          pip install safetensors numpy huggingface_hub
          pip install --no-deps ./upstream ./upstream/edge
          pip install --no-deps vocos==0.1.0 g2p_en==2.1.0 nltk==3.10.3 num2words==0.5.14 soundfile==0.14.0 soxr==1.1.0 transformers==5.19.0 regex inflect distance cffi tokenizers filelock joblib
          python -c "import nltk; nltk.download('cmudict', quiet=True)"
          python -c "import torch, torchaudio, safetensors, numpy, huggingface_hub, steertts, steertts_edge, transformers, vocos, g2p_en, soundfile; print('imports ok', torch.__version__)"
      - name: Assemble full dir from ci-assets (exact shipped set)
        run: |
          echo "ci-assets revision: $(cd ci-assets && git rev-parse --short HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
          cp -r ci-assets/full full-asm
          ls full-asm full-asm/int8
      - name: Mirror drift check (non-blocking, informational)
        run: |
          pip install -q huggingface_hub
          MIRROR_SHA=$(python -c "from huggingface_hub import HfApi; print(HfApi().model_info('ml-resources/steer-tts').sha)")
          echo "MIRROR_SHA=$MIRROR_SHA" >> "$GITHUB_ENV"
          echo "mirror revision: $MIRROR_SHA"
          python - <<'EOF'
          import hashlib, json
          from huggingface_hub import HfApi, hf_hub_download
          sha = HfApi().model_info("ml-resources/steer-tts").sha
          man = json.load(open("ci-assets/asset-manifest.json"))
          want = None
          for e in (man if isinstance(man, list) else man.get("files", [])):
            if e.get("path", "").endswith("int8/model.safetensors") or e.get("name", "") == "int8/model.safetensors":
              want = e.get("sha256") or e.get("hash")
          p = hf_hub_download("ml-resources/steer-tts", "int8/model.safetensors", revision=sha)
          h = hashlib.sha256(open(p, "rb").read()).hexdigest()
          print("mirror int8/model.safetensors sha256:", h)
          print("bundled manifest sha256:             ", want)
          print("MATCH" if want and h.startswith(want) or want == h else "DRIFT: mirror differs from shipped set (known: mirror lacks tensor encoder.layers.0.n_seq.proj.weight)")
          EOF full-asm/native/int8
      - name: Native parity run (torch CPU)
        run: |
          python studio/scripts/ci/native_parity.py --code upstream \
            --edge-dir ci-assets/edge --full-dir full-asm --out native \
            --mirror-sha "ci-assets@$(cd ci-assets && git rev-parse --short HEAD)"
      - name: WASM-node parity run (same C engine)
        run: node studio/scripts/ci/wasm_node_parity.mjs dist ci-assets/edge full-asm wasmnode
      - name: Compare (tolerances recorded in compare_parity.py)
        run: python studio/scripts/ci/compare_parity.py --native native --wasm wasmnode --report parity_report.json
      - name: Upload parity artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-${{ github.run_id }}
          path: |
            native/
            wasmnode/
            parity_report.json
      - name: Summary
        if: always()
        run: |
          if [ -f parity_report.json ]; then
            MIRROR_SHA="$MIRROR_SHA" python3 - <<'PYEOF' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          r = json.load(open('parity_report.json'))
          print('## parity verdict: ' + r['verdict'])
          print('weights: ' + os.environ.get('MIRROR_SHA', '?'))
          try:
              w = json.load(open('wasmnode/wasm_parity.json'))
              print('wasm bridge: ' + w.get('bridge', '?'))
          except OSError:
              print('wasm bridge: (no wasm_parity.json yet)')
          for c in r['checks']:
              print('- ' + c['verdict'] + ' ' + c['name'] + ' :: ' + c['detail'])
          PYEOF
          else
            echo "## parity: no report produced (early step failure - see step logs)" >> "$GITHUB_STEP_SUMMARY"
          fi
